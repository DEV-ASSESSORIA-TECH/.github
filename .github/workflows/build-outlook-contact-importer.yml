name: Release Outlook Contact Importer

on:
  push:
    tags:
      - "outlook-contact-importer-v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    defaults:
      run:
        working-directory: scripts/microsoft/outlook-contact-importer

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: scripts/microsoft/outlook-contact-importer/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build executables
        run: npm run build

      - name: Prepare release folder
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path release
          New-Item -ItemType Directory -Force -Path release\data

          Copy-Item dist\outlook-contacts-preview.exe release\
          Copy-Item dist\outlook-contacts-import.exe release\
          Copy-Item README.md release\
          Copy-Item .env.example release\
          Copy-Item data\output-example.csv release\data\

          if (Test-Path run-outlook-contact-importer.bat) {
            Copy-Item run-outlook-contact-importer.bat release\
          }

      - name: Compress release package
        shell: powershell
        run: |
          Compress-Archive -Path release\* -DestinationPath outlook-contact-importer-windows.zip -Force

      - name: Create GitHub Release
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create $env:GITHUB_REF_NAME `
            dist\outlook-contacts-preview.exe `
            dist\outlook-contacts-import.exe `
            outlook-contact-importer-windows.zip `
            --title "Outlook Contact Importer $env:GITHUB_REF_NAME" `
            --notes "Release automática do Outlook Contact Importer."